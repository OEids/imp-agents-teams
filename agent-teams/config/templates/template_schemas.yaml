# Template Output Schemas
# Defines exact column formats for each strand's output sheets
# Based on official IMP Planner Standard Workbook API templates

# ============================================================================
# STRAND 1 - Structure Data
# Template: AA_New - Strand 1 Standard Workbook API 1.200.xlsx
# ============================================================================
S1:
  template_file: "AA_New - Strand 1 Standard Workbook API 1.200.xlsx"
  template_version: "1.200"

  sheets:
    01_Funds:
      description: "Fund/Funding source definitions"
      columns:
        - name: FundCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: FundEnabled
          required: true
          type: boolean
          default: true

    02_Activity:
      description: "Activity code definitions"
      columns:
        - name: ActivityCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: ActivityEnabled
          required: true
          type: boolean
          default: true

    03_CustGroup:
      description: "Custom grouping definitions"
      columns:
        - name: CustomGroupingCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: CustomGroupingEnabled
          required: true
          type: boolean
          default: true

    04_Ledger:
      description: "Ledger definitions"
      columns:
        - name: LedgerCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: LedgerEnabled
          required: true
          type: boolean
          default: true
        - name: IsIELedger
          required: true
          type: boolean
          default: false
        - name: IsPurchaseLedger
          required: true
          type: boolean
          default: false
        - name: IsBankLedger
          required: true
          type: boolean
          default: false

    05_SchHub:
      description: "School hub/region definitions"
      columns:
        - name: SchoolHubCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: SchoolHubEnabled
          required: true
          type: boolean
          default: true

    06_SchType:
      description: "School type definitions"
      columns:
        - name: SchoolTypeCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: SchoolTypeEnabled
          required: true
          type: boolean
          default: true

    07_LocalAuth:
      description: "Local authority definitions"
      columns:
        - name: SchoolLocalAuthorityCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: SchoolLocalAuthorityEnabled
          required: true
          type: boolean
          default: true

    08_Schools:
      description: "School/Academy definitions"
      columns:
        - name: SchoolLocalAuthority
          required: false
          max_length: 10
          description: "Reference to 07_LocalAuth"
        - name: SchoolCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: SchoolHub
          required: false
          max_length: 10
          description: "Reference to 05_SchHub"
        - name: SchoolType
          required: false
          max_length: 10
          description: "Reference to 06_SchType"
        - name: Title
          required: true
          max_length: 100
        - name: LondonWeighting
          required: false
          type: string
          valid_values: ["INNER", "OUTER", "FRINGE", "NONE", ""]
        - name: UniqueReferenceNumber
          required: false
          max_length: 20
          description: "URN/DfE number"
        - name: TeachingHours
          required: false
          type: decimal
          default: 32.5
          description: "Standard teaching hours (varies by school)"
        - name: SchoolEnabled
          required: true
          type: boolean
          default: true

    09_Depts:
      description: "Department/Cost centre definitions"
      columns:
        - name: DepartmentCode
          required: true
          max_length: 10
          format: "uppercase"
        - name: Title
          required: true
          max_length: 100
        - name: AvailableToAllSchools
          required: true
          type: boolean
          default: true
        - name: SchoolCodes
          required: false
          description: "Comma-separated school codes if not available to all"
        - name: ActivityCode
          required: false
          max_length: 10
          description: "Reference to 02_Activity"
        - name: FundCode
          required: false
          max_length: 10
          description: "Reference to 01_Funds"
        - name: LedgerCode
          required: false
          max_length: 10
          description: "Reference to 04_Ledger"
        - name: DefaultFinanceCode
          required: false
          max_length: 10
          description: "Default finance code for this department"
        - name: DepartmentEnabled
          required: true
          type: boolean
          default: true

    10_FinanceCodes Budget:
      description: "Finance/Nominal code definitions"
      columns:
        - name: FinanceCode
          required: true
          max_length: 10
          format: "4_digits"
          description: "4 digit code with leading zeros"
        - name: Title
          required: true
          max_length: 100
        - name: GroupingCode
          required: false
          max_length: 10
          description: "DfE/BFR grouping code"
        - name: CustomGrouping
          required: false
          max_length: 10
          description: "Reference to 03_CustGroup"
        - name: AvailableToAllSchools
          required: true
          type: boolean
          default: true
        - name: SchoolCodes
          required: false
          description: "Comma-separated school codes if not available to all"
        - name: FinanceCodeTypeCode
          required: true
          valid_values: ["INC", "EXP", "BAL", "STAT"]
        - name: LedgerCode
          required: false
          max_length: 10
          description: "Reference to 04_Ledger"
        - name: FinanceCodeEnabled
          required: true
          type: boolean
          default: true
        - name: BalanceToScenario
          required: true
          type: boolean
          default: false
        - name: IsBalanceSheet
          required: false
          type: boolean
          default: false

# ============================================================================
# STRAND 2 - Staff Data
# Template: AA_New - Strand 2 Standard Workbook API 1.101.xlsx
# ============================================================================
S2:
