# Strand Detection Rules
# Replaces hardcoded s1_indicators, s2_indicators, s3_indicators in master_orchestrator.py

rules:
  # ============================================================================
  # S1 - Structure/Schools Strand Detection
  # ============================================================================
  - id: s1_school_keywords
    name: "S1 School Keywords"
    category: strand_detection
    condition: "contains:school,schools,academy,trust"
    weight: 2.0
    confidence_boost: 0.1
    result: S1
    metadata:
      subcategory: S1
      description: "School-related column indicators"

  - id: s1_department_keywords
    name: "S1 Department Keywords"
    category: strand_detection
    condition: "contains:department,dept,cost centre,costcentre"
    weight: 2.0
    result: S1
    metadata:
      subcategory: S1

  - id: s1_finance_keywords
    name: "S1 Finance Code Keywords"
    category: strand_detection
    condition: "contains:financecode,finance_code,nominal,ledger"
    weight: 2.5
    confidence_boost: 0.1
    result: S1
    metadata:
      subcategory: S1

  - id: s1_fund_keywords
    name: "S1 Fund Keywords"
    category: strand_detection
    condition: "contains:fund,funds,funding"
    weight: 1.5
    result: S1
    metadata:
      subcategory: S1

  - id: s1_activity_keywords
    name: "S1 Activity Keywords"
