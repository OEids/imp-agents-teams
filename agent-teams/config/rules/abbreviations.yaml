  staff_number: payroll_number

  hours_per_week: weekly_hours
  contracted_hours: weekly_hours

  date_from: start_date
  commencement_date: start_date
  hire_date: start_date

  date_to: end_date
  termination_date: end_date
  leaving_date: end_date

  job_title: position
  role_title: position
  job_role: position

  payscale: pay_scale
  scale: pay_scale

  scale_point: pay_scale_point
  spine_point: pay_scale_point
