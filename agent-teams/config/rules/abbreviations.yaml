# Bidirectional mappings - also map expansions back to standard forms
reverse_mappings:
  # These map common variations TO the standard column name
  firstname: first_name
  forename: first_name
  given_name: first_name

  lastname: last_name
  surname: last_name
  family_name: last_name

  employee_number: payroll_number
