# Strand Schemas
# Replaces hardcoded TEAMS dict in config/settings.py

strands:
  # ============================================================================
  # S1 - Structure/Schools Strand
  # ============================================================================
  - id: S1
    name: "Structure Team"
    focus: "Finance codes, schools, departments, grouping codes"
    description: "Handles foundational reference data that ties everything together"
    indicator_weight: 1.0
    indicators:
      - school
      - department
      - financeCode
      - finance_code
      - fund
      - activity
      - ledger
      - customgrouping
      - hub
      - localauthority
      - local_authority
      - cost_centre
      - costcentre
      - nominal
    key_sheets:
      - "System Grouping Codes"
      - "01_Funds"
      - "02_Activity"
      - "03_CustGroup"
      - "04_Ledger"
      - "05_SchHub"
      - "06_SchType"
      - "07_LocalAuth"
      - "08_Schools"
      - "09_Depts"
      - "10_FinanceCodes Budget"
    validation_rules:
      - "Finance codes must be 4 digits"
      - "School codes must be unique"
      - "Department codes must be 3 digits"
      - "All schools must have a local authority"
    common_issues:
      - "Finance codes with extra digits (6 instead of 4)"
      - "Missing school hub assignments"
      - "Inconsistent department naming"
    data_types:
      - name: Schools
        description: "School/Academy definitions"
        columns:
          - name: school_code
            standard_name: school_code
            data_type: string
            required: true
            variations: [school_id, academy_code, site_code, establishment]
            format_pattern: "^[A-Z0-9]{2,10}$"
          - name: school_name
            standard_name: school_name
            data_type: string
            required: true
            variations: [name, academy_name, site_name]
          - name: school_type
            standard_name: school_type
            data_type: string
            required: false
            variations: [type, phase]
          - name: local_authority
            standard_name: local_authority_code
            data_type: string
            required: false
            variations: [la_code, la]
        key_columns: [school_code]

      - name: Departments
        description: "Department definitions"
        columns:
          - name: department_code
            standard_name: department_code
            data_type: string
            required: true
            variations: [dept_code, dept, cost_centre, cost_center, costcentre, cc_code]
            format_pattern: "^[A-Z0-9_]{2,10}$"
            format_hint: "Cost centres map to departments"
          - name: department_name
            standard_name: department_name
            data_type: string
            required: true
            variations: [dept_name, name]
        key_columns: [department_code]

      - name: FinanceCodes
        description: "Finance/Nominal code definitions"
        columns:
          - name: finance_code
            standard_name: finance_code
            data_type: string
            required: true
            variations: [nominal_code, account_code, ledger_code]
            format_pattern: "^\\d{4}$"
            format_hint: "4 digits with leading zeros"
          - name: finance_name
            standard_name: finance_name
            data_type: string
            required: true
            variations: [nominal_name, account_name, description]
          - name: category
            standard_name: finance_category
            data_type: string
            required: false
            variations: [type, group]
        key_columns: [finance_code]

      - name: Funds
        description: "Fund/Funding source definitions"
        columns:
          - name: fund_code
            standard_name: fund_code
            data_type: string
            required: true
            variations: [funding_code, source_code]
          - name: fund_name
            standard_name: fund_name
            data_type: string
            required: true
            variations: [funding_name, source_name]
        key_columns: [fund_code]

  # ============================================================================
  # S2 - Staff Strand
  # ============================================================================
  - id: S2
    name: "Staff Team"
    focus: "Staff members, contracts, allowances, pensions"
    description: "Handles all personnel and contract data"
    indicator_weight: 1.2
    indicators:
      - staff
      - role
      - payroll
      - contract
      - equated
      - salary
      - pension
      - teacher
      - support
      - employee
      - personnel
      - fte
      - allowance
      - tps
      - lgps
      - njc
      - mps
      - ups
    key_sheets:
      - "25_StaffMembers"
      - "28_ContractsTeachFTE"
      - "29_ContractsSupportHours"
      - "19_PayScales"
      - "22_PayScaleGrades"
      - "20_PayScalePoints"
      - "16_AllowanceTypes"
      - "24_Pensions"
      - "34_ContractAllowances"
    validation_rules:
      - "Each staff member must have a payroll number"
      - "Salaries must match pay scale points (within tolerance)"
      - "Teaching staff must have TPS pension"
      - "Support staff must have LGPS pension"
      - "FTE must be between 0 and 1"
    common_issues:
      - "Multiple contracts per staff member not handled"
      - "Pay scale points not matching salary"
      - "Missing pension information"
      - "Equated weeks calculation errors"
    data_types:
      - name: StaffMembers
        description: "Staff/Employee definitions"
        columns:
          - name: payroll_number
            standard_name: payroll_number
            data_type: string
            required: true
            variations: [emp_no, employee_number, staff_id, personnel_no]
          - name: first_name
            standard_name: first_name
            data_type: string
            required: true
            variations: [firstname, forename, given_name]
          - name: last_name
            standard_name: last_name
            data_type: string
            required: true
            variations: [lastname, surname, family_name]
          - name: email
            standard_name: email
            data_type: string
            required: false
            variations: [email_address, work_email]
        key_columns: [payroll_number]

      - name: Contracts
        description: "Employment contracts"
        columns:
          - name: payroll_number
            standard_name: payroll_number
            data_type: string
            required: true
          - name: job_title
            standard_name: job_title
            data_type: string
            required: true
            variations: [position, role_title, post]
          - name: start_date
            standard_name: start_date
            data_type: date
            required: true
            variations: [commencement, hire_date]
          - name: end_date
            standard_name: end_date
            data_type: date
            required: false
            variations: [termination, leaving_date]
          - name: annual_salary
            standard_name: annual_salary
            data_type: decimal
            required: true
            variations: [salary, annual_pay, gross_salary]
          - name: weekly_fte
            standard_name: weekly_fte
            data_type: decimal
            required: true
            variations: [fte, full_time_equivalent]
            min_value: 0
            max_value: 1.5
          - name: weekly_hours
            standard_name: weekly_hours
            data_type: decimal
            required: false
            variations: [hours_per_week, contracted_hours]
          - name: pay_scale
            standard_name: pay_scale
            data_type: string
            required: false
            variations: [payscale, scale]
          - name: current_scale_point
            standard_name: current_scale_point
            data_type: string
            required: false
            variations: [scale_point, spine_point]
          - name: pension_code
            standard_name: pension_code
            data_type: string
            required: false
            variations: [pension, pension_scheme]
            valid_values: [TPS, LGPS_IMP, "0%"]
        key_columns: [payroll_number, start_date]

      - name: PayScales
        description: "Pay scale definitions"
        columns:
          - name: pay_scale_code
            standard_name: pay_scale_code
            data_type: string
            required: true
          - name: pay_scale_name
            standard_name: pay_scale_name
            data_type: string
            required: true
          - name: scale_type
            standard_name: scale_type
            data_type: string
            required: false
            valid_values: [teaching, support, leadership]
        key_columns: [pay_scale_code]

  # ============================================================================
  # S3 - Financial Planning Strand
  # ============================================================================
  - id: S3
    name: "Financial Team"
    focus: "Budgets, funding streams, pupil numbers"
    description: "Handles financial planning and scenario data"
    indicator_weight: 1.0
    indicators:
      - grant
      - allocation
      - budget
      - planning
      - scenario
      - saving
      - priority
      - phase
      - calculation
      - pupil
      - income
      - expenditure
      - forecast
    key_sheets:
      - "14_Calculators"
      - "15_MonthProfiles"
      - "Pupils"
      - "Funding"
      - "Income"
      - "Expenditure"
      - "BF Balances"
      - "35_ScenarioRows"
      - "36_ScenarioYearValues"
      - "37_Monthly Values"
    validation_rules:
      - "Budget must balance (income = expenditure + surplus)"
      - "Pupil numbers must be positive integers"
      - "Year values must sum to annual total"
      - "Monthly profiles must sum to 100%"
    common_issues:
      - "Budget totals not balancing"
      - "Missing monthly profiles"
      - "Grant allocations not matching pupil numbers"
    data_types:
      - name: Budgets
        description: "Budget line items"
        columns:
          - name: finance_code
            standard_name: finance_code
            data_type: string
            required: true
          - name: school_code
            standard_name: school_code
            data_type: string
            required: true
          - name: amount
            standard_name: amount
            data_type: decimal
            required: true
            variations: [value, budget_amount, total]
          - name: year
            standard_name: budget_year
            data_type: integer
            required: true
            variations: [financial_year, fy]
        key_columns: [finance_code, school_code, budget_year]

      - name: Pupils
        description: "Pupil number forecasts"
        columns:
          - name: school_code
            standard_name: school_code
            data_type: string
            required: true
          - name: year
            standard_name: year
            data_type: integer
            required: true
          - name: pupil_count
            standard_name: pupil_count
            data_type: integer
            required: true
            variations: [pupils, headcount, enrollment]
          - name: phase
            standard_name: phase
            data_type: string
            required: false
            variations: [key_stage, year_group]
        key_columns: [school_code, year]

      - name: Grants
        description: "Grant allocations"
        columns:
          - name: grant_code
            standard_name: grant_code
            data_type: string
            required: true
            variations: [funding_code, allocation_code]
          - name: grant_name
            standard_name: grant_name
            data_type: string
            required: true
            variations: [funding_name, allocation_name]
          - name: amount
            standard_name: grant_amount
            data_type: decimal
            required: true
          - name: school_code
            standard_name: school_code
            data_type: string
            required: true
        key_columns: [grant_code, school_code]
